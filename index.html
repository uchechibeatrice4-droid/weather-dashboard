<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-app">

        <header>
            <h1>Weather Dashboard</h1>
            <p>Check the weather anywhere in the world.</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >
            <button id="searchBtn">Search</button>
        </section>

        <!-- Current Weather -->
        <section class="current-weather">

            <h2 id="cityName">City Name</h2>
            <p id="date">Today's Date</p>

            <div class="temperature">
                <h1 id="temperature">--°C</h1>
                <p id="weatherDescription">Weather condition</p>
            </div>

            <div class="weather-details">
                <div>
                    <h3>Humidity</h3>
                    <p id="humidity">--%</p>
                </div>

                <div>
                    <h3>Wind Speed</h3>
                    <p id="windSpeed">-- km/h</p>
                </div>
            </div>

        </section>

        <!-- Hourly Forecast -->
        <section class="hourly-forecast">
            <h2>Hourly Forecast</h2>
            <div id="hourlyContainer">
                <!-- Hourly weather will appear here -->
            </div>
        </section>

        <!-- Weekly Forecast -->
        <section class="weekly-forecast">
            <h2>7-Day Forecast</h2>
            <div id="weeklyContainer">
                <!-- Weekly weather will appear here -->
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
